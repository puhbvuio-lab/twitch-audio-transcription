[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twitch-audio-transcription"
version = "0.1.0"
description = "Configuration scaffold for local media and Twitch VOD transcription jobs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2,<3",
  "typer>=0.12,<1",
  "yt-dlp>=2024.1.1",
  "faster-whisper>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
